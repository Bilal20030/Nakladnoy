<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Накладные и долги</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}[hidden]{display:none!important}
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb; --line:#d9dfea;
  --fg:#18202e; --muted:#5f6b80; --accent:#2346a0; --accent-fg:#ffffff; --accent-soft:#e3e9f8;
  --debt:#b42318; --debt-soft:#fde8e6; --ok:#17794a; --ok-soft:#e2f4ea;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10141c; --surface:#181e29; --surface-2:#1f2633; --line:#2c3545;
  --fg:#e6eaf2; --muted:#93a0b5; --accent:#7f9cf0; --accent-fg:#0d1220; --accent-soft:#232e4a;
  --debt:#f2867b; --debt-soft:#3a1d1c; --ok:#6fd3a0; --ok-soft:#173226; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;min-height:56px}
.top h1{font-size:19px;font-weight:700;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:0;background:var(--surface-2);border-radius:10px;width:38px;height:38px;font-size:20px;flex:none}
.main{padding:14px 16px 110px;display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:9px 2px 10px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row .s{color:var(--muted);font-size:13px}
.pill{font-family:var(--f-num);font-size:13px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.debt{background:var(--debt-soft);color:var(--debt)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.avatar{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--f-num);font-weight:600;font-size:15px;overflow-wrap:anywhere}
.stat.debt .v{color:var(--debt)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--debt);border-color:var(--debt-soft);background:var(--debt-soft)}
.btn.wide{flex:1}
.h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:6px 2px -4px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;color:var(--muted);text-align:center}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;border:0;background:var(--accent);color:var(--accent-fg);border-radius:16px;padding:14px 18px;font-weight:700;box-shadow:0 6px 18px rgba(20,40,100,.25)}
.banner{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.total-line{display:flex;justify-content:space-between;background:var(--debt-soft);color:var(--debt);border-radius:12px;padding:12px 14px;font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.inp{width:100%;min-width:0;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:var(--surface-2)}
.item .name{grid-column:1/-1;display:flex;gap:8px}
.item .x{border:0;background:var(--debt-soft);color:var(--debt);border-radius:10px;width:40px;flex:none;font-size:18px}
.item .lsum{grid-column:1/-1;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.item .lsum b{font-family:var(--f-num);color:var(--fg)}
.inv-total{display:flex;justify-content:space-between;font-weight:700;font-size:17px}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,15,25,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:90%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>

const S={clients:[],invoices:[],payments:[],products:[],settings:{},view:"sales",clientId:null,invoiceId:null,draft:null,q:"",sq:"",stack:[]};

const $=s=>document.querySelector(s);

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
